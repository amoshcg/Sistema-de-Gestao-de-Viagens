# Perfil de desenvolvimento local (sem Docker/PostgreSQL).
# O ambiente oficial continua sendo o PostgreSQL do docker-compose.
spring.datasource.url=jdbc:h2:file:./data/sgv;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# As migracoes Flyway usam sintaxe PostgreSQL; no perfil dev o schema
# e gerado pelo Hibernate a partir das entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
