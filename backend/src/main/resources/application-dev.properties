# Perfil de desenvolvimento local (sem Docker/PostgreSQL).
# O ambiente oficial continua sendo o PostgreSQL do docker-compose.
spring.datasource.url=jdbc:postgresql://database:5432/sgv_db
# O Spring puxa as variáveis que o Docker Compose injetar nele
spring.datasource.username=${API_DB_USER}
spring.datasource.password=${API_DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

# As migracoes Flyway usam sintaxe PostgreSQL; no perfil dev o schema
# e gerado pelo Hibernate a partir das entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
