spring.application.name=sgv-backend
server.port=8080

# Sobrescrito pelas variaveis de ambiente do docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgv_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}

# As tabelas sao versionadas pelo Flyway (src/main/resources/db/migration) no
# schema dedicado "sgv" (nao no "public"), que ja e criado pelo database/init.sh
# com o principio do privilegio minimo. O Flyway nao deve criar o schema por
# conta propria: isso e responsabilidade do provisionamento do banco.
spring.flyway.enabled=true
spring.flyway.schemas=sgv
spring.flyway.create-schemas=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
