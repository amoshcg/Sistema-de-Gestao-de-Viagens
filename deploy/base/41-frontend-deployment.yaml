apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sgv
    component: frontend
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sgv
      component: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sgv
        component: frontend
    spec:
      containers:
      - image: ghcr.io/amoshcg/sgv-frontend:c00f1988863ff7901b71a21e40c4408236fe15d6
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "5"
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
        name: frontend
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: sgv
            component: frontend
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
