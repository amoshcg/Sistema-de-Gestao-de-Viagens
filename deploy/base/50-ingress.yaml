apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sgv
  labels:
    app: sgv
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sgv.lab
      secretName: sgv-tls
  rules:
    - host: sgv.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
