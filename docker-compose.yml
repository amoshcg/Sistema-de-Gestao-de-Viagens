services:
  database:
    image: postgres:15-alpine
    container_name: sgv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sgv_db
      # Você precisa passar essas variáveis aqui também para o init.sh ler!
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mapeando a pasta inteira para evitar o bug do Docker Desktop no WSL
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sgv_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sgv-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgv-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/sgv_db
      SPRING_DATASOURCE_USERNAME: ${API_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${API_DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - sgv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgv-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - sgv-network

volumes:
  pgdata:

networks:
  sgv-network:
    driver: bridge