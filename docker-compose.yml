version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: sgv-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sgv_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sgv-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgv-backend
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/sgv_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: adminpassword
    ports:
      - "8080:8080"
    networks:
      - sgv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgv-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - sgv-network

volumes:
  pgdata:

networks:
  sgv-network:
    driver: bridge
